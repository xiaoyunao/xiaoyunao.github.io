---
layout: default
---
<main id="main" class="document-shell shell">
  <header class="document-heading">
    <p class="eyebrow"><a href="{{ '/' | relative_url }}">Yun-Ao Xiao</a> / {{ page.section | default: 'Academic profile' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="document-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="archive document-body">{{ content }}</div>
</main>
