<header class="site-header">
  <nav class="site-nav shell" aria-label="Main navigation">
    <a class="site-brand" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Yun-Ao Xiao<span class="brand-dot" aria-hidden="true">.</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation-links" hidden><span>Menu</span><span class="menu-icon" aria-hidden="true"></span></button>
    <div class="navigation-links" id="navigation-links">
      <a href="{{ '/#research' | relative_url }}">Research</a>
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}" {% if page.url contains link.url %}aria-current="page"{% endif %}>{{ link.nav_title | default: link.title }}</a>
      {% endfor %}
      <a class="nav-contact" href="#contact">Contact</a>
    </div>
  </nav>
</header>
